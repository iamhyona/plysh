  h += '<div class="tools"><b class="cnt" style="font-size:13px;color:#8b95a1;align-self:center">' + S.length + '개 고름</b><button class="all" id="all">전체 선택</button><button class="clr" id="clr">모두 해제</button></div>';
  h += '<div class="sec"><b>규격 용지</b><small>국제 · 국내 표준 규격과 출판 관례 크기예요</small></div>';
  h += G.map(function (g) {
    var gk = items(g).map(function (x) { return key(g, x); }), gon = gk.every(function (k) { return ST.sel.indexOf(k) >= 0; });
    return (g.sec ? '<div class="sec l"><b>' + g.sec + '</b><small>실제로 이런 크기로 만들어지고 있어요. 관례는 업계에서 흔히 쓰는 값, 대략은 제품마다 조금씩 다른 값, 예시는 정해진 크기가 없는 값이에요.</small></div>' : '') + '<div class="grp"><div class="gh"><b>' + g.t + '</b>' + (g.s ? '<small>' + g.s + '</small>' : '') +
      (g.sw ? '<div class="seg" id="bset"><button data-b="jis" class="' + (ST.bset === 'jis' ? 'on' : '') + '">JIS · 국내</button><button data-b="iso" class="' + (ST.bset === 'iso' ? 'on' : '') + '">ISO</button></div>' : '') + '<button class="ga" data-g="' + g.k + '">' + (gon ? '해제' : '전체') + '</button></div>' +
      '<div class="items">' + items(g).map(function (x) { var k = key(g, x), on = ST.sel.indexOf(k) >= 0; return '<button class="it' + (on ? ' on' : '') + '" data-k="' + esc(k) + '" style="--c:' + (on ? colOf(k) : '#b0b8c1') + '"><i></i><span><b>' + esc(x[0]) + tagOf(x[3]) + '</b><small>' + x[1] + '×' + x[2] + 'mm</small></span></button>'; }).join('') + '</div></div>';
  }).join('');
  h += '</div><div class="card view" id="view"><div class="vh"><b>실제 비율</b><div class="seg" id="mode"><button data-m="over" class="' + (ST.mode === 'over' ? 'on' : '') + '">겹쳐 보기</button><button data-m="side" class="' + (ST.mode === 'side' ? 'on' : '') + '">나란히</button></div></div>' +
    '<div class="stage">' + svgOf(S) + '</div>' +
    (S.length ? '<div class="leg">' + S.map(function (x) { return '<div><i style="background:' + colOf(x.k) + '"></i><b>' + esc(x.n) + '</b><span>' + x.w + ' × ' + x.h + 'mm</span></div>'; }).join('') + '</div>' : '') +
    '<div class="nt">겹쳐 보기는 왼쪽 아래 모서리를 맞춰서 그려요. 국내 인쇄에서 B4 · B5라고 하면 보통 JIS 크기예요.' + S.filter(function (x) { return NOTE[x.n]; }).map(function (x) { return '<br>' + esc(x.n) + ': ' + NOTE[x.n]; }).join('') + '</div></div></div>';
  h += S.length ? '<button class="fab" id="fab">비교 보기 · ' + S.length + '개</button>' : '';
  document.getElementById('main').innerHTML = h;
  var fb = document.getElementById('fab'); if (fb) fb.onclick = function () { document.querySelector('.view').scrollIntoView({ behavior: 'smooth' }); };
  [].forEach.call(document.querySelectorAll('[data-k]'), function (b) { b.onclick = function () { var k = b.dataset.k, i = ST.sel.indexOf(k); if (i >= 0) ST.sel.splice(i, 1); else ST.sel.push(k); save(); render(); }; });
  [].forEach.call(document.querySelectorAll('#mode button'), function (b) { b.onclick = function () { ST.mode = b.dataset.m; save(); render(); }; });
  [].forEach.call(document.querySelectorAll('#bset button'), function (b) { b.onclick = function () { ST.bset = b.dataset.b; save(); render(); }; });
  function gkeys(g) { return items(g).map(function (x) { return key(g, x); }); }
  [].forEach.call(document.querySelectorAll('.ga'), function (b) { b.onclick = function () {
    var g = G.filter(function (z) { return z.k === b.dataset.g; })[0], ks = gkeys(g), on = ks.every(function (k) { return ST.sel.indexOf(k) >= 0; });
    if (on) ST.sel = ST.sel.filter(function (k) { return ks.indexOf(k) < 0; }); else ks.forEach(function (k) { if (ST.sel.indexOf(k) < 0) ST.sel.push(k); });
    save(); render(); }; });
  document.getElementById('all').onclick = function () { G.forEach(function (g) { gkeys(g).forEach(function (k) { if (ST.sel.indexOf(k) < 0) ST.sel.push(k); }); }); save(); render(); };
  document.getElementById('clr').onclick = function () { ST.sel = []; save(); render(); };
}
render();
var _iw = window.innerWidth; window.addEventListener('resize', function () { if (window.innerWidth === _iw) return; _iw = window.innerWidth; clearTimeout(window._rz); window._rz = setTimeout(render, 150); });
</script>
</body>
</html>
