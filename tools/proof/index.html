같은 색 값도 주변 색·면적·종이·조명에 따라 다르게 보여요. 아래 항목은 자주 만나는 경우와 고치는 방법이에요.", "최종 판단은 모니터가 아니라 교정쇄로"], ["시각 보정", "동시 대비", "Simultaneous contrast", "같은 색도 주변 색에 따라 밝기·색이 다르게 보여요. 어두운 바탕 위 회색은 밝아 보여요.", "해결: 색은 실제로 놓일 바탕 위에서 고르기 · 여러 바탕에 같은 색을 쓰면 바탕마다 따로 확인"], ["시각 보정", "면적 효과", "Area effect", "작은 색 칩에서 고른 색이 넓은 면적에 칠하면 더 밝고 선명해 보여요.", "해결: 큰 면적은 칩보다 채도·명도를 살짝 낮추기 · 실제 크기 교정쇄로 확인"], ["시각 보정", "팽창색 · 수축색", "Advancing · Receding color", "밝고 따뜻한 색은 커 보이고 앞으로 나와 보이며, 어둡고 차가운 색은 작고 뒤로 물러나 보여요.", "해결: 밝은 도형은 조금 작게, 어두운 도형은 조금 크게 맞춰 같은 크기로 보이게"], ["시각 보정", "종이에 따른 색 변화", "Paper & dot gain", "비도공지(모조지·크라프트)는 잉크가 스며 색이 어둡고 탁해지고, 무광 코팅은 한 톤 어둡게 보여요.", "해결: 비도공지는 비도공 프로파일로 바꾸고 어두운 사진은 밝게 · 무광 코팅 포토카드는 사진을 살짝 밝게 · 본인쇄 전 교정"], ["시각 보정", "곡면 왜곡", "Curved surface distortion", "머그·텀블러처럼 둥근 면에 감기는 인쇄는 양옆으로 갈수록 좁고 작아 보여요.", "해결: 중요한 것은 정면 가운데에 · 원은 가로로 살짝 넓혀 · 업체 템플릿으로 확인"], ["시각 보정", "색 진동", "Chromostereopsis", "채도가 높은 빨강과 파랑처럼 명도가 비슷한 보색이 맞닿으면 경계가 떨리고 앞뒤로 떠 보여요.", "해결: 글자와 바탕은 명도 차이를 크게 · 보색끼리는 사이에 흰색·검정 테두리"], ["시각 보정", "동화 효과", "Assimilation · 베졸드 효과", "가는 선·작은 무늬·작은 글자의 색은 주변 색에 섞여 비슷해 보여요. 동시 대비와 반대 방향이에요.", "해결: 작은 글자·가는 선은 원하는 색보다 진하고 선명하게 · 실제 크기로 확인"], ["시각 보정", "밝기 착시", "Helmholtz–Kohlrausch effect", "채도가 높은 색은 명도 숫자가 같아도 더 밝아 보여요. 그래서 형광·원색 위 흰 글자가 생각보다 안 읽혀요.", "해결: 명도 대비는 눈 대신 흑백(그레이스케일)으로 바꿔서 판단"], ["시각 보정", "틴트 색 변화", "Abney effect", "색에 흰색을 섞어 옅게 만들면 색상이 같아도 다르게 보여요. 파랑은 보라 쪽으로, 빨강은 분홍 쪽으로 기울어 보여요.", "해결: 브랜드 색의 연한 버전은 % 망만 낮추지 말고 색상을 살짝 다시 맞추기"], ["시각 보정", "조명에 따른 색 차이", "Metamerism · 조건 등색", "종이·원단·플라스틱처럼 소재가 다르면 한 조명에서 같아 보이던 색이 다른 조명에서는 달라 보여요.", "해결: 굿즈 세트 색 맞춤은 D50 표준광과 실제 매장·집 조명 두 곳에서 확인 · 업체에 같은 조명 기준 요청"]], "착시": [["지각 원리", "착시와 시각 보정", "Optical illusion", "눈과 뇌가 주변 정보를 바탕으로 짐작해서 보기 때문에, 숫자로는 같은 것도 다르게 보여요. 디자인에서는 착시를 피하거나(시각 보정) 일부러 이용해요.", "각 분류의 시각 보정 탭에 글자·레이아웃·색에서 자주 만나는 경우와 해결 방법이 있어요"], ["지각 원리", "게슈탈트 원리", "Gestalt principles", "사람은 따로 떨어진 요소를 덩어리로 묶어서 봐요. 레이아웃·아이콘·로고에서 무엇이 한 덩어리로 읽히는지 정해 주는 원리예요.", "정보가 잘못 묶여 보이면 간격·색·정렬부터 확인", [["근접", "가까운 것끼리 한 덩어리로 보여요. 제목과 본문 간격이 같으면 어디에 속하는지 헷갈려요."], ["유사", "색·모양·크기가 같은 것끼리 묶여 보여요."], ["연속", "선이나 흐름을 따라 이어서 봐요. 끊긴 선도 이어진 것처럼."], ["폐쇄", "빈 곳이 있어도 닫힌 모양으로 채워서 봐요. 로고에 자주 활용."], ["전경과 배경", "무엇이 앞(형태)이고 무엇이 뒤(바탕)인지 나눠서 봐요."], ["공동 운명", "같은 방향으로 움직이거나 향하는 것끼리 묶여 보여요."], ["대칭", "대칭인 것은 한 덩어리로, 안정적으로 보여요."]]], ["지각 원리", "전경과 배경 · 루빈의 꽃병", "Figure–ground · Rubin vase", "같은 그림이 꽃병으로도 마주 본 두 얼굴로도 보여요. 바탕이 형태로 읽힐 수 있다는 뜻이에요.", "활용: 바탕(네거티브 스페이스)에 두 번째 모양을 숨긴 로고 · 주의: 의도하지 않은 모양이 바탕에 생기지 않는지 확인"], ["지각 원리", "주관적 윤곽 · 카니자 삼각형", "Illusory contour · Kanizsa", "선이 없는데도 이빨 빠진 원 세 개 사이에 흰 삼각형이 보여요.", "활용: 일부를 생략해도 모양이 읽히는 로고·아이콘 · 너무 많이 생략하면 안 읽혀요"], ["크기 · 길이", "뮐러-라이어 착시", "Müller-Lyer illusion", "길이가 같은 두 선도 끝의 화살표가 안쪽을 향하면 짧아 보이고, 바깥으로 벌어지면 길어 보여요.", "해결: 괄호·화살표·꺾쇠가 붙은 요소의 길이는 숫자 말고 눈으로 맞추기"], ["크기 · 길이", "에빙하우스 착시", "Ebbinghaus illusion", "같은 원도 큰 원들에 둘러싸이면 작아 보이고, 작은 원들 사이에 있으면 커 보여요.", "해결: 큰 사진·요소 옆에 놓인 로고·아이콘은 조금 크게 · 아이콘 세트는 놓일 자리에서 크기 확인"], ["크기 · 길이", "델뵈프 착시", "Delboeuf illusion", "같은 원도 바짝 둘러싼 테두리 안에서는 커 보이고, 넓은 테두리 안에서는 작아 보여요.", "활용: 접시가 작으면 음식이 많아 보이는 원리 · 액자·테두리 여백이 넓을수록 안의 사진이 작아 보여요"], ["크기 · 길이", "수직·수평 착시", "Vertical–horizontal illusion", "같은 길이라도 세로선이 가로선보다 길어 보여요.", "해결: 정사각형은 세로를 살짝 줄이기 · 세로로 긴 판형은 실제보다 더 길쭉해 보여요"], ["크기 · 길이", "폰조 착시", "Ponzo illusion", "원근감을 주는 두 사선 사이에서는 같은 막대도 먼 쪽(좁은 쪽)이 더 커 보여요.", "해결: 원근이 있는 사진 위에 글자·도형을 올릴 때 위치마다 크기를 눈으로 확인"], ["크기 · 길이", "자스트로 착시", "Jastrow illusion", "똑같은 부채꼴 두 개를 위아래로 놓으면 아래 것이 더 커 보여요. 위 것의 긴 변과 아래 것의 짧은 변을 비교해서 생기는 착시예요.", "해결: 곡선 띠·반원 그래프를 나란히 둘 때 크기 비교가 왜곡되지 않게 정렬 기준을 같게"], ["선 · 형태", "포겐도르프 착시", "Poggendorff illusion", "사선이 띠 뒤로 지나가면 양쪽 선이 어긋나 보여요.", "해결: 사진·띠·상자 뒤로 사선이 지나가는 디자인은 이어지는 위치를 눈으로 맞추기"], ["선 · 형태", "쵤너 착시", "Zöllner illusion", "짧은 빗금이 반대 방향으로 그어진 평행선들은 서로 기울어 보여요.", "해결: 빗금·사선 무늬 위에 평행한 선이나 글줄을 올릴 때 기울어 보이지 않는지 확인"], ["선 · 형태", "헤링 착시", "Hering illusion", "방사선(햇살 무늬) 위에 놓인 두 평행 직선이 바깥으로 휘어 보여요.", "해결: 집중선·방사형 배경 위의 직선·글줄은 기울거나 휘어 보이지 않게 위치 조정"], ["선 · 형태", "카페 벽 착시", "Café wall illusion", "검정·흰 벽돌을 반 칸씩 어긋나게 쌓으면 반듯한 가로줄이 쐐기처럼 기울어 보여요.", "해결: 체크·벽돌 무늬 패턴은 줄 사이 회색 선 굵기와 어긋남 정도를 조절 · 출력해서 확인"], ["명도 · 색", "헤르만 격자", "Hermann grid", "검은 네모가 흰 줄로 나뉜 격자에서 흰 줄이 만나는 곳에 회색 점이 깜빡이듯 보여요.", "해결: 어두운 사진을 좁은 흰 간격으로 촘촘히 배치하면 생겨요 · 간격을 넓히거나 바탕을 회색으로"], ["명도 · 색", "마하 밴드", "Mach bands", "명도가 계단처럼 바뀌는 곳마다 경계 바로 옆이 더 밝거나 더 어둡게 보여 줄무늬가 강조돼요.", "해결: 그라데이션 단계가 보이면(밴딩) 단계를 더 잘게 · 노이즈를 아주 조금"], ["명도 · 색", "체커 그림자 착시", "Checker shadow illusion", "그림자 안의 밝은 칸과 그림자 밖의 어두운 칸이 실제로는 같은 회색이에요. 뇌가 그림자를 빼고 계산해서 다르게 보여요.", "해결: 사진 보정·색 맞춤은 눈 대신 스포이드로 숫자 확인"], ["명도 · 색", "색 순응 · 잔상", "Adaptation · Afterimage", "한 색을 오래 보면 눈이 익숙해져 덜 선명해 보이고, 시선을 옮기면 보색 잔상이 남아요.", "해결: 오래 작업한 화면은 잠깐 쉬고 다시 보기 · 형광·원색 넓은 면 옆 흰 면은 보색 기운이 돌 수 있어요"], ["패턴 · 움직임", "모아레", "Moiré", "규칙적인 무늬 두 개가 겹치면 원래 없던 물결무늬가 생겨요. 인쇄 망점 각도, 원단 무늬 촬영, 스캔한 인쇄물에서 자주 생겨요.", "해결: 인쇄물을 스캔하면 디스크린(모아레 제거) · 줄무늬 원단 사진은 각도를 바꿔 찍기 · 망점 각도는 인쇄소에 맡기기"], ["패턴 · 움직임", "옵아트 진동", "Op art · MacKay effect", "가는 줄무늬·동심원을 촘촘히 반복하면 화면이 떨리거나 움직이는 것처럼 보여요.", "활용: 강한 시각 효과 · 주의: 글자 뒤 배경이나 넓은 면에 쓰면 눈이 피곤하고 읽기 어려워요"], ["패턴 · 움직임", "반짝이는 격자", "Scintillating grid", "회색 격자 교차점에 흰 점을 두면 점 안에 검은 점이 깜빡이듯 나타났다 사라져요.", "해결: 격자형 패턴에서 교차점 장식은 출력해서 확인"]], "사진": [["노출", "노출", "Exposure", "사진이 받는 빛의 양. 조리개·셔터 속도·ISO 세 가지로 정해져서 노출 삼각형이라고 불러요.", "셋 중 하나를 바꾸면 나머지로 밝기를 맞춰야 해요", [["조리개 (f값)", "렌즈 구멍 크기. 숫자가 작을수록(f1.8) 밝고 배경이 흐려져요."], ["셔터 속도", "빛을 받는 시간. 빠를수록(1/1000초) 움직임이 멈추고, 느릴수록 흔들림·잔상."], ["ISO", "빛에 대한 감도. 높을수록 밝지만 노이즈가 생겨요."]]], ["노출", "히스토그램", "Histogram", "사진의 어두운 곳부터 밝은 곳까지 픽셀이 얼마나 있는지 보여 주는 그래프.", "오른쪽 끝에 붙으면 하이라이트 날림, 왼쪽 끝에 붙으면 암부 뭉침"], ["노출", "하이라이트 날림 · 암부 뭉침", "Clipping", "너무 밝은 곳이 하얗게 날아가거나 너무 어두운 곳이 까맣게 뭉쳐 정보가 사라진 것. 보정으로 되살릴 수 없어요.", "인쇄에서는 흰 옷·피부 하이라이트가 종이색으로 뚫려 보여요 · 원본 단계에서 확인"], ["노출", "다이내믹 레인지", "Dynamic range", "한 장에 담을 수 있는 가장 어두운 곳부터 가장 밝은 곳까지의 폭. 인쇄는 화면보다 폭이 좁아요.", "화면에서 괜찮던 어두운 사진이 인쇄하면 뭉칠 수 있어요"], ["노출", "화이트 밸런스", "White balance", "조명 색에 따라 흰색이 흰색으로 보이도록 색온도를 맞추는 것.", "같은 세트 사진은 화이트 밸런스를 같게 · 회색 카드로 기준 잡기"], ["렌즈 · 초점", "초점 거리", "Focal length", "렌즈의 화각을 정하는 숫자(mm). 작을수록   h += '<div class="ct" style="margin-top:14px">가까운 색</div>' + nn.map(function (x) { return swl(x[1], '<em>ΔE ' + x[0].toFixed(1) + '</em>'); }).join('');
  h += '<div class="nt" style="margin-top:10px">CMYK는 화면값으로 계산한 근사치예요. 4도 재현은 PANTONE Color Bridge 기준으로 인쇄소와 확인하세요. 코팅지(C)와 비코팅지(U)는 같은 번호도 색이 달라 보여요.</div></div></div>';
  el.innerHTML = h; el.style.display = 'flex'; document.body.style.overflow = 'hidden';
  var close = function () { el.style.display = 'none'; el.innerHTML = ''; document.body.style.overflow = ''; };
  $('#pkX').onclick = close; el.onclick = function (e) { if (e.target === el) close(); };
  $('#ptFv').onclick = function () { var i = PT.fav.indexOf(key); if (i < 0) PT.fav.push(key); else PT.fav.splice(i, 1); ls.set('pr:ptfav', JSON.stringify(PT.fav)); ptDetail(c); if (S.view === 'pt') renderPt(); };
  el.querySelectorAll('[data-cp]').forEach(function (b) { b.onclick = function () { copyText(b.dataset.cp, '‘' + b.dataset.cp + '’ 복사했어요'); }; });
  el.querySelectorAll('[data-pc]').forEach(function (b) { b.onclick = function () { var p = b.dataset.pc.split(':'); ptDetail(PT.L[p[0]][+p[1]]); }; });
}
