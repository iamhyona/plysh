<style>

:root { --bg:#f2f4f6; --card:#fff; --line:#e5e8eb; --line2:#f2f4f6; --t1:#191f28; --t2:#4e5968; --t3:#8b95a1; --t4:#b0b8c1; --blue:#3182f6; --bluebg:#e8f3ff; }
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html, body { background:var(--bg); color:var(--t1); font-family:'Pretendard Variable', Pretendard, -apple-system, sans-serif; font-size:14px; line-height:1.5; letter-spacing:0; }
button, input { font:inherit; color:inherit; }
svg.i { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; }
main { max-width:1120px; margin:0 auto; padding:20px 16px 80px; }
html.emb main { padding-top:16px; }
.phd { margin:0 0 20px; } .phd b { display:block; font-size:24px; font-weight:800; letter-spacing:-0.02em; } .phd small { display:block; margin-top:6px; font-size:14px; color:var(--t3); }
html.emb .phd { display:none; }
.lay { display:grid; grid-template-columns:minmax(0,1fr); gap:16px; align-items:start; }
.side { display:none; }
@media (min-width:760px) {
  .lay { grid-template-columns:minmax(0,1fr) 272px; }
  .side { display:block; position:sticky; top:0; max-height:100vh; overflow:auto; scrollbar-width:none; }
  .side::-webkit-scrollbar { display:none; }
  .fbtn { display:none !important; }
}
/* 검색 + 칩 한 줄 (PC) · 모바일은 두 줄 */
.bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:0 0 12px; }
.q { position:relative; flex:1 1 0; min-width:0; }
@media (min-width:760px) { .qrow { flex:1 1 260px !important; max-width:360px !important; } }
.q svg { position:absolute; left:14px; top:13px; color:var(--t3); }
.q input { width:100%; height:46px; border:0; background:#fff; border-radius:12px; padding:0 40px 0 44px; font-size:16px; outline:none; }
.q input:focus { box-shadow:inset 0 0 0 1.5px #4e5968; }
.q .x { position:absolute; right:8px; top:9px; width:28px; height:28px; border:0; border-radius:50%; background:#e5e8eb; color:var(--t2); display:none; align-items:center; justify-content:center; cursor:pointer; }
.q .x svg { position:static; width:14px; height:14px; color:var(--t2); }
.q.on .x { display:flex; }
.chips { display:flex; flex-wrap:wrap; gap:6px; }
.chip { height:36px; padding:0 16px; border:0; border-radius:18px; background:#fff; color:var(--t2); font-size:14px; font-weight:600; cursor:pointer; white-space:nowrap; display:inline-flex; align-items:center; gap:6px; }
.chip small { font-size:12px; color:var(--t3); font-weight:600; }
.chip.on { background:var(--t1); color:#fff; } .chip.on small { color:#b0b8c1; }
.fbtn { flex:none; width:46px; height:46px; padding:0; border-radius:12px; justify-content:center; position:relative; }
.fbtn em { position:absolute; top:6px; right:6px; }
.chips#kind { flex:1 1 100%; }
@media (min-width:760px) { .chips#kind { flex:0 1 auto; } }
.fbtn em { font-style:normal; min-width:18px; height:18px; border-radius:9px; background:var(--t1); color:#fff; font-size:11px; display:none; align-items:center; justify-content:center; padding:0 5px; }
.fbtn.has em { display:inline-flex; }
/* 제품 크기로 찾기 */
.pbox { margin:0 0 12px; }
.pbox .pt { display:flex; align-items:center; justify-content:space-between; gap:8px; }
.pbox .pt b { font-size:16px; font-weight:800; }
.pbox .pt button { height:36px; padding:0 16px; border:0; border-radius:10px; background:var(--line2); color:var(--t2); font-size:13px; font-weight:700; cursor:pointer; }
.pbox > p { margin-top:6px; font-size:13px; color:var(--t3); }
.pin { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; margin-top:18px; }
@media (min-width:640px) { .pin { grid-template-columns:repeat(4,minmax(0,1fr)); } }
.pin label { display:block; font-size:13px; font-weight:600; color:var(--t2); margin:0 0 8px; }
.pin span { position:relative; display:block; }
.pin input { width:100%; height:46px; border:0; border-radius:12px; background:var(--line2); padding:0 40px 0 14px; font-size:16px; font-weight:700; font-variant-numeric:tabular-nums; outline:none; }
.pin input:focus { box-shadow:inset 0 0 0 1.5px #4e5968; background:#fff; }
.pin input::placeholder { color:var(--t4); font-weight:600; }
.pin em { position:absolute; right:14px; top:14px; font-style:normal; font-size:13px; color:var(--t3); }
.tg.warn { background:#fdecec; color:#f04452; }
/* 결과 머리 */
.box { background:var(--card); border-radius:20px; padding:20px; }
@media (max-width:519px) { .box { padding:16px; } }
.fit { margin:0 0 12px; }
.fit b { display:block; font-size:16px; font-weight:800; }
.fit p { margin-top:6px; font-size:13px; color:var(--t3); }
.cnt { margin:4px 0 12px; font-size:13px; color:var(--t3); }
.cnt b { color:var(--t2); font-weight:700; }
.grp { margin:28px 0 12px; font-size:16px; font-weight:800; display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 8px; } .grp span { white-space:nowrap; }
.grp:first-child { margin-top:0; } .grp small { font-size:13px; color:var(--t3); font-weight:600; }
.grid { display:grid; grid-template-columns:minmax(0,1fr); gap:12px; }
@media (min-width:640px) { .grid { grid-template-columns:repeat(2,minmax(0,1fr)); } }
@media (min-width:1180px) { .grid { grid-template-columns:repeat(3,minmax(0,1fr)); } }
.card { background:var(--card); border-radius:20px; padding:20px; display:flex; flex-direction:column; gap:14px; }
@media (max-width:519px) { .card { padding:16px; } }
.ch { display:flex; gap:14px; align-items:center; }
.pic { width:48px; height:48px; flex:none; display:flex; align-items:center; justify-content:center; }
.pic svg { overflow:visible; }
.sz { min-width:0; flex:1; }
.sz b { display:block; font-size:19px; font-weight:800; letter-spacing:-0.01em; font-variant-numeric:tabular-nums; cursor:copy; }
.sz b span { font-size:14px; font-weight:700; color:var(--t3); }
.sz .how { margin-top:4px; display:block; font-size:13px; color:var(--t2); line-height:1.5; }
.sz div { margin-top:2px; display:flex; flex-wrap:wrap; gap:4px 8px; font-size:13px; color:var(--t3); }
.tg { display:inline-flex; align-items:center; height:22px; padding:0 8px; border-radius:6px; background:var(--line2); color:var(--t2); font-size:12px; font-weight:700; white-space:nowrap; }
.tg.rec { background:var(--bluebg); color:var(--blue); }
.buys { display:flex; flex-direction:column; gap:6px; }
.buy { display:flex; align-items:center; gap:10px; min-height:40px; padding:8px 12px 8px 14px; border-radius:12px; background:var(--line2); text-decoration:none; color:var(--t1); }
.buy:hover { background:#e9ecef; }
.buy b { font-size:14px; font-weight:700; white-space:nowrap; }
.buy span { flex:1; min-width:0; font-size:13px; color:var(--t3); text-align:right; line-height:1.4; }
.buy svg { width:16px; height:16px; color:var(--t3); }
.empty { padding:48px 20px; text-align:center; color:var(--t3); font-size:14px; line-height:1.6; }
.more { display:flex; justify-content:center; margin-top:12px; }
.btn2 { height:40px; padding:0 18px; border:0; border-radius:12px; background:#fff; color:var(--t2); font-size:14px; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; gap:6px; text-decoration:none; }
/* 필터 패널 */
.fp { background:var(--card); border-radius:20px; padding:20px; }
.fs + .fs { margin-top:28px; }
.fs h5 { font-size:13px; font-weight:700; color:var(--t2); margin:0 0 8px; display:flex; justify-content:space-between; }
.fs h5 small { font-weight:600; color:var(--t3); }
.fp .chip { background:var(--line2); }
.fp .chip.on { background:var(--t1); }
.use { display:flex; flex-direction:column; gap:4px; }
.use button { display:flex; align-items:center; justify-content:space-between; gap:8px; min-height:40px; padding:0 12px; border:0; border-radius:10px; background:none; text-align:left; cursor:pointer; font-size:14px; font-weight:600; color:var(--t2); }
.use button small { font-size:12px; color:var(--t3); font-weight:600; font-variant-numeric:tabular-nums; }
.use button.on { background:var(--line2); color:var(--t1); box-shadow:inset 0 0 0 1.5px #4e5968; }
.cus { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; margin-top:8px; }
.cus label { display:block; font-size:12px; font-weight:600; color:var(--t3); margin:0 0 6px; }
.cus span { position:relative; display:block; }
.cus input { width:100%; height:46px; border:0; border-radius:10px; background:var(--line2); padding:0 26px 0 10px; font-size:16px; font-weight:700; font-variant-numeric:tabular-nums; outline:none; }
.cus input:focus { box-shadow:inset 0 0 0 1.5px #4e5968; background:#fff; }
.cus em { position:absolute; right:8px; top:14px; font-style:normal; font-size:12px; color:var(--t3); }
.rst { margin-top:28px; width:100%; height:40px; border:0; border-radius:12px; background:var(--line2); color:var(--t2); font-size:14px; font-weight:700; cursor:pointer; }
/* 안내 */
.notes { margin-top:28px; }
.notes details { background:var(--card); border-radius:20px; }
.notes details + details { margin-top:12px; }
.notes summary { list-style:none; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:18px 20px; font-size:15px; font-weight:700; }
.notes summary::-webkit-details-marker { display:none; }
.notes summary svg { color:var(--t3); transition:transform .15s; }
.notes details[open] summary svg { transform:rotate(180deg); }
.nb { padding:0 20px 20px; font-size:14px; color:var(--t2); line-height:1.7; }
.nb li { list-style:none; position:relative; padding-left:12px; } .nb li + li { margin-top:6px; }
.nb li::before { content:''; position:absolute; left:0; top:11px; width:4px; height:4px; border-radius:50%; background:var(--t4); }
.nb a { color:var(--blue); text-decoration:none; }
.src { margin-top:12px; font-size:12px; color:var(--t3); line-height:1.6; }
.glo { margin-top:12px; }
/* 모바일 필터 시트 */
.dim { position:fixed; inset:0; background:rgba(0,0,0,.45); opacity:0; pointer-events:none; transition:opacity .2s; z-index:40; }
.sheet { position:fixed; left:0; right:0; bottom:0; max-height:86vh; overflow:auto; background:#fff; border-radius:20px 20px 0 0; padding:20px 16px calc(24px + env(safe-area-inset-bottom)); transform:translateY(100%); transition:transform .22s; z-index:41; }
.sheet .fp { padding:0; }
.sheet .sh { display:flex; align-items:center; justify-content:space-between; margin:0 0 20px; font-size:18px; font-weight:800; }
.cls { width:40px; height:40px; border:0; border-radius:50%; background:#191f28; color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; }
.cls svg { width:18px; height:18px; }
body.sopen .dim { opacity:1; pointer-events:auto; } body.sopen .sheet { transform:none; }
.toast { position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:#191f28; color:#fff; font-size:14px; font-weight:600; padding:12px 18px; border-radius:12px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:50; white-space:nowrap; }
.toast.on { opacity:1; }

/* 포장재 찾기 추가 */
.types { display:flex; gap:6px; flex-wrap:wrap; margin:0 0 16px; }
.types button { height:40px; padding:0 18px; border:0; border-radius:12px; background:#fff; color:var(--t2); font-size:15px; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
.types button small { font-size:12px; color:var(--t3); font-weight:600; }
.types button.on { background:var(--t1); color:#fff; } .types button.on small { color:#b0b8c1; }
.pin.p3 { grid-template-columns:repeat(2,minmax(0,1fr)); }
@media (min-width:640px) { .pin.p3 { grid-template-columns:repeat(4,minmax(0,1fr)); } }
.dims { display:grid; grid-template-columns:auto 1fr; gap:2px 10px; font-size:13px; color:var(--t2); }
.dims dt { color:var(--t3); font-weight:600; }
.dims dd { font-variant-numeric:tabular-nums; }
.tg.jp { background:#fff4e5; color:#c26a00; }
.tg.q { background:#fdecec; color:#f04452; }
.buy { display:grid; grid-template-columns:1fr auto; gap:2px 10px; padding:10px 12px 10px 14px; }
.buy b { white-space:normal; }
.buy span { grid-column:1; grid-row:2; text-align:left; }
.buy svg { grid-column:2; grid-row:1 / span 2; }
</style>
</head>
