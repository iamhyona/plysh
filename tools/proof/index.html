  h += '</div>';
  var list = L.slice();

  side += '<div class="pgrp"><div class="plb">색 계열</div><div class="pch">' + FAMS.map(function (f) { return '<button data-fam="' + f[0] + '"' + (f[0] === PT.fam && !PT.favOnly ? ' class="on"' : '') + '>' + (f[0] ? '<i class="fd ' + f[0] + '"></i>' : '') + f[1] + '</button>'; }).join('') + '<button data-favo' + (PT.favOnly ? ' class="on"' : '') + '><svg class="pic" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-2px;flex:none"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9 6.8 19.6l1-5.8L3.5 9.7l5.9-.9z"/></svg>즐겨찾기<small>' + PT.fav.length + '</small></button></div></div>';

    $('#pkX').onclick = close; $('#pkOk').onclick = function () { if (pick) { PT.tgt = pick; PT.q = ''; } close(); renderPt(); };
  };
  img.src = url;
}
