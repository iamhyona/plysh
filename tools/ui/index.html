<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>UI 용어사전 · 공부방</title>
<script>/* github에서 열 때만: PLYSH 접속 승인된 기기만 */try{if(/github\.io$/.test(location.hostname)&&localStorage.getItem('d4:ok')!=='1')location.replace('../../')}catch(e){}</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 공부방 · UI 용어사전 (2026-11-28)
   - 실장님 웹앱 규칙: Pretendard, 모노톤, 선 픽토그램 아이콘(이모지·기호 금지), 높이 52/46/40/36/32
   - 왼쪽 메뉴 = 과목 분류(대 > 중), 필터만 오른쪽 패널, 팝업은 전체 딤 + PC 가운데 / 모바일 아래 시트
   - 카드마다 [움직여 보기] 무대: 누르거나 재생해서 바로 확인
   - 공부방(study) 안에서는 iframe으로 열리고, 이때 자체 메뉴·머리는 숨김 */
:root{--t1:#191f28;--t2:#4e5968;--t3:#8b95a1;--t4:#b0b8c1;--ln:#e5e8eb;--bg:#f2f4f6;--wh:#fff;--blue:#3182f6;--red:#f04452;--sw:232px;color-scheme:light}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--t1);font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:15px;letter-spacing:0;overflow-x:clip}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.ic{width:20px;height:20px;flex:none;display:block}
.hide{display:none!important}
/* 왼쪽 메뉴 */
#nav{display:none}
@media(min-width:1024px){
  html:not(.emb) body{padding-left:var(--sw)}
  html:not(.emb) #nav{display:block;position:fixed;left:0;top:0;bottom:0;width:var(--sw);background:#fff;border-right:1px solid var(--ln);padding:16px 12px 40px;overflow:auto;z-index:20}
}
#nav .brand{display:block;padding:4px 10px 14px;font-size:18px;font-weight:800;color:var(--t1)}
#nav .g{display:flex;align-items:center;gap:10px;width:100%;height:40px;padding:0 12px;border-radius:12px;font-size:16px;font-weight:700;color:var(--t1);margin-top:2px}
#nav .g .cv{margin-left:auto;width:16px;height:16px;color:var(--t4);transition:transform .2s}
#nav .g.op .cv{transform:rotate(90deg)}
#nav .s{display:flex;align-items:center;width:100%;height:36px;padding:0 12px 0 40px;border-radius:10px;font-size:14px;font-weight:500;color:var(--t2);text-align:left;margin-top:2px}
#nav .s:hover{background:var(--bg)}
#nav .s.on{background:var(--t1);color:#fff;font-weight:600}
#nav .n{margin-left:auto;font-size:12px;color:var(--t4);font-weight:500}
#nav .s.on .n{color:#b0b8c1}
/* 머리 */
header{position:sticky;top:0;z-index:15;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.hd{display:flex;align-items:center;gap:8px;max-width:1040px;margin:0 auto}
.hd .logo{font-size:18px;font-weight:800;margin-right:6px;white-space:nowrap}
@media(min-width:1024px){.hd .logo{display:none}header{padding:16px 40px 12px}}
.srch{flex:1;position:relative}
.srch input{width:100%;height:46px;border:0;border-radius:14px;background:#fff;padding:0 40px 0 44px;font-size:16px;outline:none}
.srch input:focus{box-shadow:inset 0 0 0 1.5px var(--t2)}
.srch .ic{position:absolute;left:14px;top:13px;color:var(--t3)}
.srch .x{position:absolute;right:8px;top:7px;width:32px;height:32px;border-radius:50%;display:none;align-items:center;justify-content:center;color:var(--t4)}
.srch.has .x{display:flex}
.fbtn{flex:none;display:inline-flex;align-items:center;gap:6px;height:46px;padding:0 16px;border-radius:14px;background:#fff;font-size:14px;font-weight:600;color:var(--t2)}
.fbtn .ic{width:18px;height:18px}
.fbtn.on{background:var(--t1);color:#fff}
#chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;max-width:1040px;margin:10px auto 0}
#chips::-webkit-scrollbar{display:none}
#chips button{flex:none;height:36px;padding:0 16px;border-radius:999px;background:#fff;font-size:13px;font-weight:600;color:var(--t2)}
#chips button.on{background:var(--t1);color:#fff}
@media(min-width:1024px){html:not(.emb) #chips{display:none}}
/* 본문 */
main{max-width:1040px;margin:0 auto;padding:0 16px 80px}
@media(min-width:1024px){main{padding:0 40px 80px}}
.ph{padding:14px 0 20px}
.ph .bc{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--t3)}
.ph .bc .ic{width:12px;height:12px;color:var(--t4)}
.ph h1{margin:6px 0 0;font-size:24px;font-weight:800;line-height:1.3}
.ph p{margin:6px 0 0;font-size:14px;color:var(--t3);line-height:1.5}
@media(min-width:1024px){.ph{padding-top:10px;padding-bottom:24px}}
html.emb .ph{display:none}
/* 2026-11-29 실장님: PLYSH · 공부방 안에서는 다른 도구와 같은 줄(왼쪽 끝 = 페이지 제목)에 맞추고, 분류 칩은 모바일만 (PC는 왼쪽 메뉴) */
html.emb header{padding:0 0 24px}
html.emb .hd,html.emb #chips,html.emb main{max-width:none}
html.emb main{padding:0 0 80px}
@media(min-width:900px){html.emb #chips{display:none}}
html.emb header .logo{display:none}
section{margin-top:28px}
section:first-of-type{margin-top:0}
section>h2{margin:0 0 12px;font-size:18px;font-weight:800}
section>h2 small{margin-left:6px;font-size:13px;font-weight:600;color:var(--t4)}
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@container (min-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
main{container-type:inline-size}
.card{background:#fff;border-radius:20px;padding:20px;display:flex;flex-direction:column}
@media(max-width:600px){.card{padding:16px}}
.card .tt{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 8px}
.card .ko{font-size:17px;font-weight:700;line-height:1.4}
.card .en{font-size:13px;font-weight:500;color:var(--t3)}
.card .mine{margin-left:auto;align-self:center;font-size:12px;font-weight:600;color:var(--t2);background:var(--bg);border-radius:6px;padding:3px 8px;white-space:nowrap}
.card .ds{margin:6px 0 0;font-size:14px;line-height:1.55;color:var(--t2)}
.stage{position:relative;margin-top:14px;background:var(--bg);border-radius:14px;min-height:168px;padding:20px 16px;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:1}
.stage.tall{min-height:240px}
.card.pr2{grid-column:1/-1}
.pairw{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.pc{display:flex;flex-direction:column;min-width:0}
.pn{font-size:13px;font-weight:700;color:var(--t1);margin-bottom:6px;padding-left:2px}
.pc .stage{margin-top:0}
@media(max-width:600px){.pairw{grid-template-columns:1fr}}
.rp{position:absolute;right:8px;top:8px;height:32px;padding:0 12px 0 10px;border-radius:16px;background:#fff;color:var(--t2);display:flex;align-items:center;gap:4px;font-size:12px;font-weight:600;z-index:9}
.rp .ic{width:14px;height:14px}
.empty{text-align:center;color:var(--t3);padding:60px 0;font-size:15px}
.empty .ic{width:32px;height:32px;margin:0 auto 10px;color:var(--t4)}
/* 공통 데모 부품 */
.col{display:flex;flex-direction:column;gap:10px;width:100%;max-width:300px}
.row{display:flex;align-items:center;gap:8px}
.wrapr{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.box{background:#fff;border-radius:12px;padding:12px 14px;width:100%}
.lb{font-size:13px;font-weight:600;color:var(--t2)}
.sm{font-size:12px;color:var(--t3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 16px;border-radius:12px;background:var(--t1);color:#fff;font-size:14px;font-weight:600;white-space:nowrap}
.btn.sub{background:#fff;color:var(--t1)}
.btn.gh{background:transparent;color:var(--t2);padding:0 8px}
.btn.big{height:46px;width:100%}
.btn .ic{width:16px;height:16px}
.btn[disabled]{background:var(--ln);color:var(--t4);cursor:default}
.ibtn{width:32px;height:32px;border-radius:50%;background:#fff;display:inline-flex;align-items:center;justify-content:center;color:var(--t2);flex:none}
.ibtn .ic{width:18px;height:18px}
.fld{height:46px;width:100%;border:1px solid var(--ln);border-radius:12px;background:#fff;padding:0 14px;font-size:16px;outline:none}
.fld:focus{border-color:var(--t2)}
.chip{height:36px;padding:0 16px;border-radius:999px;background:#fff;font-size:13px;font-weight:600;color:var(--t2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{background:var(--t1);color:#fff}
.chip .ic{width:14px;height:14px}
.sw{position:relative;width:44px;height:26px;border-radius:13px;background:var(--ln);transition:background .2s;flex:none}
.sw::after{content:'';position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .2s}
.sw.on{background:var(--blue)}
.sw.on::after{transform:translateX(18px)}
.cb{width:20px;height:20px;border-radius:4px;border:1.5px solid var(--t4);background:#fff;display:inline-flex;align-items:center;justify-content:center;flex:none;color:#fff}
.cb .ic{width:14px;height:14px;opacity:0}
.on>.cb,.cb.on{background:var(--blue);border-color:var(--blue)}
.on>.cb .ic,.cb.on .ic{opacity:1}
.rd{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--t4);background:#fff;flex:none;position:relative}
.on>.rd{border-color:var(--blue)}
.on>.rd::after{content:'';position:absolute;inset:4px;border-radius:50%;background:var(--blue)}
.opt{display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;border-radius:10px;background:#fff;font-size:14px;font-weight:500;width:100%;text-align:left}
.seg{display:flex;background:var(--ln);border-radius:12px;padding:3px;width:100%;max-width:300px}
.seg button{flex:1;height:34px;border-radius:9px;font-size:13px;font-weight:600;color:var(--t3);transition:background .2s,color .2s}
.seg button.on{background:#fff;color:var(--t1);box-shadow:inset 0 0 0 1.5px var(--t2)}
.tabs{display:flex;position:relative;border-bottom:1px solid var(--ln);width:100%}
.tabs button{flex:1;height:40px;font-size:14px;font-weight:600;color:var(--t3)}
.tabs button.on{color:var(--t1)}
.tabs i{position:absolute;bottom:-1px;height:2px;background:var(--t1);transition:left .25s,width .25s}
.menu{position:absolute;background:#fff;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.12);padding:6px;min-width:150px;z-index:6}
.menu button{display:flex;align-items:center;gap:8px;width:100%;height:36px;padding:0 10px;border-radius:8px;font-size:14px;text-align:left}
.menu button:hover{background:var(--bg)}
.menu .rd2{color:var(--red)}
.pill{background:var(--t1);color:#fff;border-radius:999px;padding:10px 16px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.pill .ic{width:16px;height:16px}
.say{position:absolute;left:50%;bottom:14px;transform:translate(-50%,20px);opacity:0;transition:.3s;pointer-events:none}
.say.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.phone{width:150px;height:210px;border-radius:22px;background:#fff;border:6px solid var(--t1);position:relative;overflow:hidden}
.sk{background:var(--ln);border-radius:6px;height:10px}
.bar{height:8px;border-radius:4px;background:var(--ln);overflow:hidden;width:100%}
.bar>i{display:block;height:100%;width:0;background:var(--blue);border-radius:4px}
.ok{color:var(--blue)}
.bad{color:var(--red)}
.tri{width:10px;height:10px}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}
@keyframes shim{from{background-position:-200px 0}to{background-position:200px 0}}
@keyframes indet{0%{left:-40%}100%{left:100%}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(49,130,246,.45)}100%{box-shadow:0 0 0 22px rgba(49,130,246,0)}}
@keyframes mq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes rip{to{transform:scale(4);opacity:0}}
.spin{width:32px;height:32px;border-radius:50%;border:3px solid var(--ln);border-top-color:var(--blue);animation:spin .8s linear infinite}
.dots{display:flex;gap:6px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--blue);animation:blink 1.2s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
.shim{background:linear-gradient(90deg,var(--ln) 0,#f7f8fa 50%,var(--ln) 100%);background-size:400px 100%;animation:shim 1.2s linear infinite}
/* 와이어프레임 */
.wf{width:100%;max-width:280px;background:#fff;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px}
.stage .b,.wf .b{background:var(--ln);border-radius:6px}
.stage .k,.wf .k{background:var(--t1);border-radius:6px}
.stage .a,.wf .a{background:#d6e6fd;border-radius:6px}
.stage .l,.wf .l{height:6px;background:var(--ln);border-radius:3px}
/* 팝업 (공통): 뒤 화면 그대로, 전체 딤, PC 가운데 / 모바일 아래 시트 */
#ovl{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .2s}
#ovl.show{opacity:1;pointer-events:auto}
@media(min-width:1024px){html:not(.emb) #ovl{padding-left:calc(var(--sw) + 16px)}}
#ovl .pop{position:relative;background:#fff;border-radius:20px;width:min(400px,100%);padding:24px 20px 20px;transform:translateY(12px);transition:transform .2s}
#ovl.show .pop{transform:none}
@media(max-width:600px){#ovl{align-items:flex-end;padding:0}#ovl .pop{width:100%;border-radius:20px 20px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom));transform:translateY(100%)}#ovl.show .pop{transform:none}}
#ovl .cls{position:absolute;right:14px;top:14px;width:40px;height:40px;border-radius:50%;background:var(--t1);color:#fff;display:flex;align-items:center;justify-content:center}
#ovl h3{margin:0 50px 6px 0;font-size:18px;font-weight:800}
#ovl p{margin:0 0 18px;font-size:14px;color:var(--t2);line-height:1.55}
/* 필터 패널 (오른쪽) */
#fp{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s}
#fp.show{opacity:1;pointer-events:auto}
#fp .pn{position:absolute;right:0;top:0;bottom:0;width:min(320px,100%);background:#fff;padding:24px 20px;transform:translateX(100%);transition:transform .25s}
#fp.show .pn{transform:none}
#fp h3{margin:0 0 18px;font-size:18px;font-weight:800}
#fp .opt{background:var(--bg);height:46px;margin-bottom:8px;justify-content:space-between}
#fp .cls{position:absolute;right:14px;top:14px;width:40px;height:40px;border-radius:50%;background:var(--t1);color:#fff;display:flex;align-items:center;justify-content:center}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<nav id="nav"></nav>
<header>
  <div class="hd">
    <span class="logo">공부방</span>
    <label class="srch" id="srch"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" placeholder="용어 찾기 (한글·영어)" autocomplete="off"><button class="x" id="qx" type="button" aria-label="지우기"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></label>
    <button class="fbtn" id="fbtn" type="button"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M7 12h10M10 17h4"/></svg>필터</button>
  </div>
  <div id="chips"></div>
</header>
<main id="main"></main>
<div id="ovl"><div class="pop"><button class="cls" type="button" data-close aria-label="닫기"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="ovb"></div></div></div>
<div id="fp"><div class="pn"><button class="cls" type="button" data-fclose aria-label="닫기"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button><h3>필터</h3>
  <button class="opt" type="button" data-f="demo">움직여 볼 수 있는 것만<span class="sw"></span></button>
  <button class="opt" type="button" data-f="mine">내 웹앱에서 쓰는 것만<span class="sw"></span></button>
  <p class="sm" style="margin-top:14px;line-height:1.5">내 웹앱 = PITCH · PLYSH · 루틴 · 가계부 · 폰트 앱에서 이미 쓰고 있는 것</p>
</div></div>
<script>
{

const P={

function enter(els,d=90,from='translateY(12px)'){return Promise.all([...els].map((e,i)=>ani(e,[{opacity:0,transform:from},{opacity:1,transform:'none'}],{delay:i*d})))}

async function curTo(st,el,dx=.5,dy=.6){if(!el)return;const c=wcur(st),r=st.getBoundingClientRect(),e=el.getBoundingClientRect();c.style.left=(e.left-r.left+e.width*dx)+'px';c.style.top=(e.top-r.top+e.height*dy)+'px';await wait(750)}
async function tap(st){const c=wcur(st);c.style.transform='scale(.8)';await wait(160);c.style.transform=''}

WA.appbar=async st=>{const on=loopOn(st),[s,y]=$$('.ibtn',st);while(on()){await curTo(st,y);await tap(st);await ani($('svg',y),[{transform:'scaleX(1)'},{transform:'scaleX(-1)'},{transform:'scaleX(1)'}],{duration:700});await curTo(st,s);await tap(st);await wait(900)}};

WA.dashboard=async st=>{const on=loopOn(st);while(on()){const B=$$('.row .a',st),N=$$('.box b',st);N.forEach((n,i)=>{const v=[1240,86][i];countTo(n,v,i?'%':'',900,x=>x.toLocaleString())});await Promise.all(B.map((b,i)=>ani(b,[{transform:'scaleY(0)',transformOrigin:'bottom'},{transform:'none',transformOrigin:'bottom'}],{duration:600,delay:i*90})));await wait(1800)}};

WA.timeline=async st=>{const on=loopOn(st),R=$$('.box>.row',st);while(on()){R.forEach(r=>{$('i',r).style.background='var(--ln)';$$('span',r).forEach(s=>s.style.color='var(--t4)')});for(const r of R.slice(0,3)){if(!on())return;await wait(450);const i=$('i',r);i.style.transition='background .3s';i.style.background='var(--blue)';ani(i,[{transform:'scale(1.6)'},{transform:'none'}],{duration:350});$$('span',r).forEach(s=>{s.style.transition='color .3s';s.style.color='var(--t1)'})}await wait(1600)}};
WA.pinned=async st=>{const on=loopOn(st),col=$('.col',st);while(on()){const B=$$('.col>.box',col),last=B[B.length-1];await curTo(st,last);await tap(st);const h=last.offsetHeight+6;await Promise.all([ani(last,[{transform:'none'},{transform:`translateY(${-h*(B.length-1)}px)`}],{duration:500}),...B.slice(0,-1).map(b=>ani(b,[{transform:'none'},{transform:`translateY(${h}px)`}],{duration:500}))]);B.forEach(b=>b.getAnimations().forEach(a=>a.cancel()));col.prepend(last);B.forEach(b=>{b.style.boxShadow='';$('.pn2',b).textContent=''});last.style.boxShadow='inset 0 0 0 1.5px var(--t2)';$('.pn2',last).textContent='고정';await wait(1300)}};
WA.safe=async st=>{const on=loopOn(st),d=$$('.phone>div',st)[1];while(on()){await ani(d,[{opacity:.3,transform:'scale(1.06)'},{opacity:1,transform:'none'}],{duration:900});await wait(900)}};
WA.edge=async st=>{const on=loopOn(st),ph=$('.phone',st),pg=ph.children[1];while(on()){await curTo(st,ph,.03,.5);await tap(st);const c=wcur(st);c.style.left=(parseFloat(c.style.left)+90)+'px';await ani(pg,[{transform:'none'},{transform:'translateX(80%)',opacity:.4}],{duration:700});await wait(300);pg.getAnimations().forEach(a=>a.cancel());await wait(700)}};
WA.splash=async st=>{const on=loopOn(st),l=$('.ibtn',st);while(on()){await ani(l,[{transform:'scale(.4)',opacity:0},{transform:'scale(1.1)',opacity:1},{transform:'none'}],{duration:700});await wait(900);await ani(l,[{opacity:1},{opacity:0}],{duration:300});await wait(300)}};

const ST={skeuo:'background:linear-gradient(#fdf3c8,#f6e08a);border-radius:14px;box-shadow:0 6px 10px rgba(120,80,0,.3),inset 0 1px 0 #fff;border:1px solid #c9a646;color:#6b4e00',flat:'background:#f5b700;border-radius:14px;color:#fff',material:'background:#fff;border-radius:6px;box-shadow:0 2px 4px rgba(0,0,0,.14),0 8px 16px rgba(0,0,0,.1);color:var(--t1)',neu:'background:#e8ecf1;border-radius:18px;box-shadow:8px 8px 16px #c9ced6,-8px -8px 16px #fff;color:#4e5968',glass:'background:rgba(255,255,255,.35);border-radius:18px;border:1px solid rgba(255,255,255,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#191f28',clay:'background:#fcd9b8;border-radius:26px;box-shadow:inset -6px -6px 12px rgba(0,0,0,.08),inset 6px 6px 12px rgba(255,255,255,.7),0 10px 18px rgba(240,140,80,.35);color:#8a4b1c',brutal:'background:#ffe066;border:3px solid #111;border-radius:6px;box-shadow:6px 6px 0 #111;color:#111',liquid:'background:linear-gradient(135deg,rgba(255,255,255,.55),rgba(255,255,255,.15));border-radius:26px;border:1px solid rgba(255,255,255,.8);box-shadow:inset 0 1px 1px #fff,0 8px 24px rgba(49,130,246,.25);backdrop-filter:blur(14px) saturate(1.6);-webkit-backdrop-filter:blur(14px) saturate(1.6);color:#191f28',y2k:'background:linear-gradient(135deg,#e0e7ff,#c4b5fd,#a5f3fc,#e0e7ff);border-radius:20px;border:2px solid #fff;box-shadow:0 0 0 2px #a78bfa,0 6px 18px rgba(139,92,246,.3);color:#4c1d95',minimal:'background:#fff;border-radius:4px;border:1px solid #e5e8eb;color:#191f28'};
D.style=(st,k)=>{const bg=k==='glass'||k==='liquid'?'background:linear-gradient(135deg,#8fb3e8,#f4b6c2,#f9e3a1)':k==='neu'?'background:#e8ecf1':'';st.setAttribute('style',(st.getAttribute('style')||'')+';'+bg);st.innerHTML=`<div style="width:110px;height:110px;${ST[k]};display:flex;flex-direction:column;justify-content:center;gap:7px;padding:22px"><i style="height:6px;border-radius:3px;background:currentColor;opacity:.8;width:80%"></i><i style="height:6px;border-radius:3px;background:currentColor;opacity:.6"></i><i style="height:6px;border-radius:3px;background:currentColor;opacity:.4;width:60%"></i></div>`};
const MD={space:[`<div class="box" style="padding:4px;font-size:12px;line-height:1.2"><b>제주 3박 4일</b><div>11.20 ~ 11.23, 2명</div><span class="btn" style="height:24px;font-size:11px">예약</span></div>`,`<div class="box" style="padding:20px;line-height:1.5"><b>제주 3박 4일</b><div class="sm" style="margin:4px 0 12px">11.20 ~ 11.23, 2명</div><span class="btn" style="height:36px">예약</span></div>`],round:[`<div style="background:#fff;padding:14px;border-radius:0"><b>제주 3박 4일</b><div style="margin-top:8px;height:36px;background:var(--t1)"></div></div>`,`<div class="box" style="border-radius:20px;padding:14px"><b>제주 3박 4일</b><div class="btn" style="margin-top:8px;width:100%;border-radius:12px"></div></div>`],type:[`<div class="box"><div style="font-size:14px;font-weight:700">제주 3박 4일</div><div style="font-size:14px;font-weight:700">11.20 ~ 11.23, 2명</div></div>`,`<div class="box"><div style="font-size:24px;font-weight:800">제주 3박 4일</div><div class="sm">11.20 ~ 11.23, 2명</div></div>`],accent:[`<div class="box row" style="flex-wrap:wrap">${['#f04452','#4fb286','#e9b54c','#8b71d0','#3182f6'].map(c=>`<span class="btn" style="background:${c};height:28px;padding:0 10px;font-size:11px">버튼</span>`).join('')}</div>`,`<div class="box row" style="flex-wrap:wrap">${[1,0,0,0].map(c=>`<span class="btn" style="background:${c?'var(--blue)':'var(--bg)'};color:${c?'#fff':'var(--t2)'};height:28px;padding:0 10px;font-size:11px">버튼</span>`).join('')}</div>`],shadow:[`<div class="box" style="box-shadow:4px 6px 0 rgba(0,0,0,.6)"><b>카드</b></div>`,`<div class="box" style="box-shadow:0 4px 16px rgba(0,0,0,.06)"><b>카드</b></div>`],line:[`<div class="box" style="padding:0 12px">${'<div style="height:34px;border-bottom:3px solid #191f28"></div>'.repeat(3)}</div>`,`<div class="box" style="padding:0 12px">${'<div style="height:34px;border-bottom:1px solid var(--ln)"></div>'.repeat(3)}</div>`],card:[`<div style="background:#fff;padding:10px" class="col">${'<div class="l"></div>'.repeat(5)}</div>`,`<div class="col" style="gap:6px">${'<div class="box col" style="gap:5px"><div class="l"></div><div class="l" style="width:60%"></div></div>'.repeat(2)}</div>`],gray:[`<div class="box"><div style="font-weight:700;color:#000">제목</div><div style="color:#000">본문 글자</div><div style="color:#000">보조 설명</div></div>`,`<div class="box"><div style="font-weight:700;color:#191f28">제목</div><div style="color:#4e5968">본문 글자</div><div style="color:#8b95a1;font-size:13px">보조 설명</div></div>`]};
D.modern=(st,k)=>{let a=1;const r=()=>{st.innerHTML=`<div class="col" style="align-items:center;max-width:260px"><div style="width:100%">${MD[k][a]}</div><div class="seg" style="max-width:160px">${['전','후'].map((t,i)=>`<button class="${i==a?'on':''}" data-a="${i}">${t}</button>`).join('')}</div></div>`};r();st.onclick=e=>{const b=e.target.closest('[data-a]');if(b){a=+b.dataset.a;r()}}};

/* ───────── 화면 그리기 ───────── */
const F={demo:0,mine:0};let CUR=CATS[0].id,Q='';
const OPEN=new Set([CUR]);
function navHTML(){const cnt=c=>c.subs.reduce((n,s)=>n+s.items.length,0);return `<span class="brand">공부방</span><div class="sm" style="padding:0 12px 8px;font-weight:700">UI·UX</div>`+CATS.map(c=>`<button class="s ${c.id===CUR&&!Q?'on':''}" data-c="${c.id}" style="padding-left:12px;gap:10px">${ic(c.ic)}${c.t}<span class="n">${cnt(c)}</span></button>`).join('')}
P.pen='<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>';P.tap='<circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8" opacity=".5"/>';P.layout='<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 9v11"/>';
function card(t){if(t.pr)return `<div class="card pr2"><div class="tt"><span class="ko">${esc(t.ko)}</span><span class="en">${esc(t.en)}</span></div><p class="ds">${esc(t.ds)}</p><div class="pairw">${t.ko.split(' vs ').map((n,i)=>`<div class="pc"><span class="pn">${esc(n)}</span><div class="stage" data-demo="${esc(t.pr[i])}"></div></div>`).join('')}</div></div>`;const dm=t.demo;return `<div class="card"><div class="tt"><span class="ko">${esc(t.ko)}</span><span class="en">${esc(t.en)}</span>${t.mine?'<span class="mine">내 앱</span>':''}</div><p class="ds">${esc(t.ds)}</p>${dm?`<div class="stage" data-demo="${esc(dm)}"></div>`:''}</div>`}
function filt(L){return L.filter(t=>(!F.demo||t.demo)&&(!F.mine||t.mine)&&(!Q||(t.ko+' '+t.en+' '+t.ds).toLowerCase().includes(Q)))}
function render(){
  const m=$('#main');let h='';
  if(Q){const L=filt(ALL);h=`<div class="ph"><div class="bc">UI·UX${ic('cvR')}찾기</div><h1>'${esc(Q)}' 찾은 결과 ${L.length}개</h1><p>모든 분류에서 찾았어요</p></div>`;
    if(!L.length)h+=`<div class="empty">${ic('searchX')}찾는 용어가 없어요. 다른 말로 찾아보세요</div>`;
    else CATS.forEach(c=>{const S=filt(c.subs.flatMap(s=>s.items));if(S.length)h+=`<section><h2>${c.t}<small>${S.length}</small></h2><div class="grid">${S.map(card).join('')}</div></section>`})}
  else{const c=CATS.find(x=>x.id===CUR);h=`<div class="ph"><div class="bc">UI·UX${ic('cvR')}${c.t}</div><h1>${c.t}</h1><p>${c.d}</p></div>`;let any=0;
    c.subs.forEach(s=>{const L=filt(s.items);if(!L.length)return;any=1;h+=`<section><h2>${s.t}<small>${L.length}</small></h2><div class="grid">${L.map(card).join('')}</div></section>`});
    if(!any)h+=`<div class="empty">${ic('doner')}필터에 맞는 용어가 없어요</div>`}
  m.innerHTML=h;$$('.ph .bc svg',m).forEach(s=>s.style.cssText='width:12px;height:12px');
  $('#nav').innerHTML=navHTML();
  $('#chips').innerHTML=CATS.map(c=>`<button data-c="${c.id}" class="${c.id===CUR&&!Q?'on':''}">${c.t}</button>`).join('');
  const on=$('#chips .on');if(on)on.scrollIntoView({inline:'center',block:'nearest'});
  io.disconnect();$$('.stage',m).forEach(s=>io.observe(s));
  document.title=(Q?'찾기':CATS.find(x=>x.id===CUR).t)+' · UI 용어사전';
}
function addRp(st){if($('.rp',st))return;const b=document.createElement('button');b.className='rp';b.type='button';b.innerHTML=ic('replay')+'다시 보기';b.onclick=e=>{e.stopPropagation();run(st)};st.appendChild(b)}
/* 펼친 목록·메뉴가 무대 밖으로 잘리지 않게: 열리면 무대 높이를 늘리고 닫히면 되돌림 (2026-11-28 실장님) */
function fitStage(st){const open=$$('.menu:not(.hide)',st);if(!open.length){if(st._mh){st._mh='';st.style.minHeight=st.style.paddingTop=st.style.alignItems=''}return}const r=st.getBoundingClientRect();let over=0;open.forEach(m=>{over=Math.max(over,m.getBoundingClientRect().bottom+16-r.bottom)});if(over<=0)return;if(!st._mh){const top=[...st.children].filter(x=>x.tagName!=='STYLE'&&!x.classList.contains('rp')&&!x.classList.contains('say'))[0];if(top){st.style.paddingTop=Math.round(top.getBoundingClientRect().top-r.top)+'px';st.style.alignItems='flex-start'}}st._mh=Math.ceil(st.offsetHeight+over)+'px';st.style.minHeight=st._mh}
/* 등장 · 텍스트 · 그래프처럼 한 번 움직이고 끝나는 것은 화면에 보이는 동안 계속 반복 (2026-11-28 실장님) */
const LOOP={m:2800,stagger:2800,typewriter:4200,letterStagger:2800,scramble:3200,highlight:3000,countUp:3200,rolling:3400,ease:2800,tr:3000,progress:3200,ring:3200,checkDraw:2600,sent:2400,stamp:2600,badgeUnlock:2600,confetti:3400,upload:4200,timeLeft:5200,agentSteps:4600,chart:3800,skeleton:4600};
function run(st){const [k,a]=st.dataset.demo.split(':');const f=D[k];if(!f)return;clearInterval(st._i);clearTimeout(st._t);clearTimeout(st._lp);st._g=(st._g||0)+1;if(LOOP[k]){const again=()=>{if(!st.isConnected)return;if(st._vis)run(st);else st._lp=setTimeout(again,800)};st._lp=setTimeout(again,LOOP[k])}cancelAnimationFrame(st._r);st.onclick=null;st.onpointerdown=st.onpointermove=st.onpointerleave=null;st.removeAttribute('style');try{f(st,a)}catch(e){console.error(k,e)}if(st.style.padding==='0px'){const c=[...st.children].find(x=>x.tagName==='DIV');if(c&&/px/.test(c.style.height)){st.style.minHeight=c.style.height;c.style.position='absolute';c.style.inset='0';c.style.height='auto';c.style.width='auto'}}if(f.replay)addRp(st);st._mh='';if(!st._mo){st._mo=new MutationObserver(ms=>{if(ms.some(m=>m.target!==st))requestAnimationFrame(()=>fitStage(st))});st._mo.observe(st,{subtree:true,childList:true,attributes:true,attributeFilter:['class']})}}
const io=new IntersectionObserver(es=>es.forEach(e=>{e.target._vis=e.isIntersecting;if(e.isIntersecting&&!e.target._on){e.target._on=1;run(e.target)}}),{rootMargin:'120px'});
/* 팝업 */
window.openPop=h=>{$('#ovb').innerHTML=h;$('#ovl').classList.add('show')};
$('#ovl').onclick=e=>{if(e.target.id==='ovl'||e.target.closest('[data-close]'))$('#ovl').classList.remove('show')};
/* 필터 */
$('#fbtn').onclick=()=>$('#fp').classList.add('show');
$('#fp').onclick=e=>{if(e.target.id==='fp'||e.target.closest('[data-fclose]')){$('#fp').classList.remove('show');return}const b=e.target.closest('[data-f]');if(b){F[b.dataset.f]^=1;$('.sw',b).classList.toggle('on',!!F[b.dataset.f]);$('#fbtn').classList.toggle('on',F.demo||F.mine);render()}};
/* 메뉴 · 찾기 */
document.addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(b&&!b.closest('.stage'))go(b.dataset.c)});
function go(id){if(!CATS.find(c=>c.id===id))id=CATS[0].id;CUR=id;Q='';$('#q').value='';$('#srch').classList.remove('has');if(location.hash!=='#'+id)try{history.replaceState(null,'','#'+id)}catch(e){}render();window.scrollTo(0,0);lastSec=-1;secPing()}
/* 왼쪽 메뉴 소메뉴 = 지금 분류의 묶음(고르기 · 날짜·시간 …). 누르면 그 묶음으로 이동, 스크롤하면 지금 묶음이 진하게 */
const secs=()=>$$('main section');
function secTop(e){try{if(window.frameElement)return window.frameElement.getBoundingClientRect().top+e.getBoundingClientRect().top}catch(x){}return e.getBoundingClientRect().top}
function secCur(){const L=secs();let k=0;L.forEach((e,i)=>{if(secTop(e)<=140)k=i});return k}
window.uiSubs=()=>{const k=secCur();return secs().map((e,i)=>{const h=$('h2',e);return{t:h.firstChild.textContent.trim(),n:h.querySelector('small')?h.querySelector('small').textContent:'',on:i===k}})};
window.uiSub=i=>{const e=secs()[i];if(!e)return;try{const fr=window.frameElement;if(fr){const y=parent.scrollY+fr.getBoundingClientRect().top+e.getBoundingClientRect().top-90;parent.scrollTo({top:y,behavior:'smooth'});return}}catch(x){}window.scrollTo({top:window.scrollY+e.getBoundingClientRect().top-90,behavior:'smooth'})};
let lastSec=-1;const secPing=()=>{const k=secCur();if(k!==lastSec){lastSec=k;try{parent.subTick&&parent.subTick()}catch(x){}}};
try{if(window.parent!==window)parent.addEventListener('scroll',()=>requestAnimationFrame(secPing),{passive:true})}catch(x){}
window.addEventListener('scroll',()=>requestAnimationFrame(secPing),{passive:true});
window.uiGo=go;window.plyshGo=go;window.uiCats=CATS.map(c=>({id:c.id,t:c.t,d:c.d,n:c.subs.reduce((n,s)=>n+s.items.length,0)}));
let qt;$('#q').oninput=e=>{clearTimeout(qt);qt=setTimeout(()=>{Q=e.target.value.trim().toLowerCase();$('#srch').classList.toggle('has',!!Q);render()},150)};
$('#qx').onclick=()=>{$('#q').value='';Q='';$('#srch').classList.remove('has');render()};
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&h!==CUR)go(h)});
try{if(window.parent!==window)document.documentElement.classList.add('emb')}catch(e){}
const h0=location.hash.slice(1);if(CATS.find(c=>c.id===h0))CUR=h0;
render();
}
</script>
